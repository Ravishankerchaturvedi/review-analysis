[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-analysis"
version = "0.1.0"
description = "Customer review analysis you can check: themes, sentiment and complaints, each citing the review IDs behind it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravi Shanker Chaturvedi" }]
keywords = ["review-analysis", "customer-reviews", "sentiment-analysis", "voice-of-customer", "customer-feedback", "reputation-management", "ai-agent", "starter-agent", "citations", "nlp", "cli", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ravishankerchaturvedi/review-analysis"
Issues = "https://github.com/Ravishankerchaturvedi/review-analysis/issues"
Changelog = "https://github.com/Ravishankerchaturvedi/review-analysis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
review-analysis = "review_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["review_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]